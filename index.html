<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nerd Sync | Twitch Dashboard</title>
  <script src="config.js"></script>
  <style>
    :root {
      --bg-color: #0b0914;
      --card-bg: #161224;
      --card-hover: #1e1832;
      --accent-purple: #8b5cf6;
      --accent-purple-glow: rgba(139, 92, 246, 0.4);
      --accent-hover: #7c3aed;
      --text-main: #f3f0ff;
      --text-muted: #9ca3af;
      --border-color: #2e2647;
      --live-badge: #ef4444;
      --glass-bg: rgba(22, 18, 36, 0.75);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      margin-bottom: 32px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .d20-logo { width: 36px; height: 36px; fill: none; stroke: var(--accent-purple); stroke-width: 1.8; }
    h1 { font-size: 1.8rem; font-weight: 800; color: #fff; }
    h1 span { color: var(--accent-purple); }

    .btn {
      background-color: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background-color: var(--accent-hover); }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 40px 0 20px 0;
      flex-wrap: wrap;
      gap: 12px;
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sort-select, .filter-select {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--accent-purple); }

    .thumbnail-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
    .thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }

    .twitch-link {
      display: block;
      text-align: center;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid var(--accent-purple);
      color: var(--text-main);
      text-decoration: none;
      padding: 8px;
      margin-top: auto;
      border-radius: 6px;
      font-weight: 600;
    }

    .pagination { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
    .page-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 14px; border-radius: 6px; cursor: pointer; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .empty-state { color: var(--text-muted); font-style: italic; grid-column: 1 / -1; padding: 20px 0; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg class="d20-logo" viewBox="0 0 100 100">
        <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" />
        <line x1="50" y1="5" x2="50" y2="95" />
        <line x1="10" y1="25" x2="90" y2="25" />
        <line x1="10" y1="75" x2="90" y2="75" />
      </svg>
      <h1>Nerd <span>Sync</span></h1>
    </div>
    <button id="auth-btn" class="btn">Log in with Twitch</button>
  </header>

  <!-- LIVE SECTION -->
  <section>
    <div class="section-header">
      <h2>LIVE Followed Streamers</h2>
      <div class="controls-wrapper">
        <select id="category-live" class="filter-select" onchange="renderLiveSection()">
          <option value="ALL">All Categories</option>
        </select>
        <select id="sort-live" class="sort-select" onchange="renderLiveSection()">
          <option value="viewers-desc">Sort by Viewers (High to Low)</option>
          <option value="viewers-asc">Sort by Viewers (Low to High)</option>
          <option value="uptime-desc">Sort by Uptime (Longest)</option>
          <option value="uptime-asc">Sort by Uptime (Shortest)</option>
        </select>
      </div>
    </div>
    <div id="live-section" class="grid"><p class="empty-state">Log in to view live streamers.</p></div>
    <div id="live-pagination" class="pagination"></div>
  </section>

  <!-- OFFLINE SECTION -->
  <section>
    <div class="section-header">
      <h2>Offline Channels & Schedules</h2>
      <div class="controls-wrapper">
        <select id="category-offline" class="filter-select" onchange="renderOfflineSection()">
          <option value="ALL">All Categories</option>
        </select>
        <select id="sort-offline" class="sort-select" onchange="renderOfflineSection()">
          <option value="ending-soon">Sort by Ending Soon</option>
          <option value="follow-desc">Sort by Follow Age (Oldest)</option>
        </select>
      </div>
    </div>
    <div id="offline-section" class="grid"><p class="empty-state">Log in to view offline channels.</p></div>
    <div id="offline-pagination" class="pagination"></div>
  </section>

  <script>
    const clientId = (typeof CONFIG !== 'undefined' && CONFIG.TWITCH_CLIENT_ID) ? CONFIG.TWITCH_CLIENT_ID : '';
    let rawLiveData = [], rawOfflineData = [];
    let pages = { live: 1, offline: 1 };
    const ITEMS_PER_PAGE = 10;

    const token = new URLSearchParams(window.location.hash.substring(1)).get('access_token');

    async function twitchFetch(endpoint, token) {
      const cacheKey = `twitch_cache_${endpoint}`;
      const cached = sessionStorage.getItem(cacheKey);
      if (cached) {
        const { timestamp, data } = JSON.parse(cached);
        if (Date.now() - timestamp < 180000) return data;
      }

      const res = await fetch(`https://api.twitch.tv/helix/${endpoint}`, {
        headers: { 'Client-ID': clientId, 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      sessionStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data }));
      return data;
    }

    async function initDashboard(accessToken) {
      try {
        const userRes = await twitchFetch('users', accessToken);
        const userId = userRes.data[0].id;

        const followsRes = await twitchFetch(`channels/followed?user_id=${userId}`, accessToken);
        const followedChannels = followsRes.data || [];

        const liveRes = await twitchFetch(`streams/followed?user_id=${userId}`, accessToken);
        rawLiveData = liveRes.data || [];

        const liveIds = new Set(rawLiveData.map(s => s.user_id));
        const offlineList = followedChannels.filter(c => !liveIds.has(c.broadcaster_id));

        rawOfflineData = await Promise.all(offlineList.map(async u => {
          let nextScheduleText = 'No stream scheduled';
          let nextEnd = null;
          try {
            const schedRes = await twitchFetch(`schedule?broadcaster_id=${u.broadcaster_id}`, accessToken);
            const segment = schedRes.data?.segments?.[0];
            if (segment && segment.start_time) {
              const startDate = new Date(segment.start_time);
              nextScheduleText = `Next: ${startDate.toLocaleDateString([], { month: 'short', day: 'numeric' })} at ${startDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
              if (segment.end_time) nextEnd = new Date(segment.end_time).getTime();
            }
          } catch (e) {}
          return { ...u, game_name: u.game_name || 'Uncategorized', nextScheduleText, nextEnd };
        }));

        populateCategoryDropdown('category-live', rawLiveData, 'game_name');
        populateCategoryDropdown('category-offline', rawOfflineData, 'game_name');

        renderLiveSection();
        renderOfflineSection();
      } catch (err) {
        console.error('Error fetching data:', err);
      }
    }

    function populateCategoryDropdown(dropdownId, items, keyName) {
      const dropdown = document.getElementById(dropdownId);
      const categories = Array.from(new Set(items.map(i => i[keyName]).filter(Boolean))).sort();
      dropdown.innerHTML = '<option value="ALL">All Categories</option>' + 
        categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
    }

    function paginate(items, page) {
      const totalPages = Math.ceil(items.length / ITEMS_PER_PAGE) || 1;
      const currentPage = Math.max(1, Math.min(page, totalPages));
      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      return { items: items.slice(start, start + ITEMS_PER_PAGE), currentPage, totalPages };
    }

    function renderLiveSection() {
      const categoryFilter = document.getElementById('category-live').value;
      let filtered = categoryFilter === 'ALL' ? [...rawLiveData] : rawLiveData.filter(s => s.game_name === categoryFilter);

      const paged = paginate(filtered, pages.live);
      const container = document.getElementById('live-section');

      if (paged.items.length === 0) {
        container.innerHTML = '<p class="empty-state">No streams found for this category.</p>';
        return;
      }

      container.innerHTML = paged.items.map(s => `
        <div class="card">
          <div class="thumbnail-wrapper"><img src="${s.thumbnail_url.replace('{width}', '440').replace('{height}', '248')}"></div>
          <div class="card-body">
            <div class="card-title">${s.user_name}</div>
            <div class="card-meta">Category: ${s.game_name}</div>
            <div class="card-meta">Viewers: ${s.viewer_count.toLocaleString()}</div>
            <a class="twitch-link" href="https://twitch.tv/${s.user_login}" target="_blank">Open Stream &rarr;</a>
          </div>
        </div>
      `).join('');
    }

    function renderOfflineSection() {
      const categoryFilter = document.getElementById('category-offline').value;
      let filtered = categoryFilter === 'ALL' ? [...rawOfflineData] : rawOfflineData.filter(u => u.game_name === categoryFilter);

      const paged = paginate(filtered, pages.offline);
      const container = document.getElementById('offline-section');

      if (paged.items.length === 0) {
        container.innerHTML = '<p class="empty-state">No offline channels found for this category.</p>';
        return;
      }

      container.innerHTML = paged.items.map(u => `
        <div class="card">
          <div class="card-body">
            <div class="card-title">${u.broadcaster_name}</div>
            <div class="card-meta">Category: ${u.game_name}</div>
            <div class="card-meta" style="color: var(--accent-purple); font-weight: 600;">${u.nextScheduleText}</div>
            <a class="twitch-link" href="https://twitch.tv/${u.broadcaster_login}" target="_blank">Open Channel &rarr;</a>
          </div>
        </div>
      `).join('');
    }

    if (token) {
      document.getElementById('auth-btn').textContent = 'Logged In';
      initDashboard(token);
    } else {
      document.getElementById('auth-btn').onclick = () => {
        const redirect = window.location.origin + window.location.pathname;
        window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirect)}&response_type=token&scope=user:read:follows`;
      };
    }
  </script>
</body>
</html>
