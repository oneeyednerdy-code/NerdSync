<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NerdSync - Better Twitch Discovery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Roobert, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0e0e10;
      color: #efeff1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    /* --- LOGIN VIEW --- */
    .login-card {
      background-color: #18181b;
      padding: 2.5rem;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .brand-header h1 {
      color: #9146ff;
      font-size: 1.8rem;
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .btn-twitch {
      width: 100%;
      padding: 0.8rem;
      background-color: #9146ff;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s;
    }

    .btn-twitch:hover {
      background-color: #772ce8;
    }

    /* --- DISCOVERY VIEW --- */
    .discovery-container {
      width: 100%;
      max-width: 1200px;
      padding: 2rem;
      align-self: flex-start;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #26262c;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #3a3a3d;
    }

    .stream-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .stream-card {
      background-color: #18181b;
      border-radius: 6px;
      overflow: hidden;
    }

    .thumbnail {
      width: 100%;
      height: 150px;
      background-color: #26262c;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #adadb8;
    }

    .live-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background-color: #eb0400;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .stream-info {
      padding: 1rem;
    }

    .stream-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .streamer-name, .game-name {
      font-size: 0.85rem;
      color: #adadb8;
    }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="login-view" class="login-card">
    <div class="brand-header">
      <svg height="40" viewBox="0 0 40 40" width="40" fill="#9146ff"><path d="M10 6L6 10v20h8v4h4l4-4h6l8-8V6H10zm24 16l-4 4h-6l-4 4v-4h-4V8h18v14zM28 12h-3v8h3v-8zm-8 0h-3v8h3v-8z"/></svg>
      <h1>StreamVerse</h1>
    </div>
    <button id="twitch-login-btn" class="btn-twitch">
      <svg height="20" viewBox="0 0 40 40" width="20" fill="#ffffff"><path d="M10 6L6 10v20h8v4h4l4-4h6l8-8V6H10zm24 16l-4 4h-6l-4 4v-4h-4V8h18v14zM28 12h-3v8h3v-8zm-8 0h-3v8h3v-8z"/></svg>
      Log in with Twitch
    </button>
  </div>

  <!-- DISCOVERY SECTION -->
  <div id="discovery-view" class="discovery-container hidden">
    <div class="top-bar">
      <h2>Browse Live Channels</h2>
      <div class="user-profile">
        <img id="user-avatar" class="user-avatar" src="" alt="" />
        <span id="welcome-msg" style="color: #adadb8;"></span>
      </div>
    </div>

    <div id="stream-grid" class="stream-grid">
      <!-- Streams loaded via JS or placeholder -->
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    // 1. Register an app on Twitch Developer Console (https://dev.twitch.tv/console)
    // 2. Set OAuth Redirect URL to your local URL (e.g., http://localhost:3000 or http://127.0.0.1:5500/index.html)
    // 3. Paste your Client ID below:
    const CLIENT_ID = 'YOUR_TWITCH_CLIENT_ID';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'user:read:email';

    const loginView = document.getElementById('login-view');
    const discoveryView = document.getElementById('discovery-view');
    const loginBtn = document.getElementById('twitch-login-btn');

    // OAuth Redirect Handler
    loginBtn.addEventListener('click', () => {
      const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(SCOPES)}`;
      window.location.href = authUrl;
    });

    // Parse OAuth token from URL hash on redirect back
    function getAccessTokenFromUrl() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    async function fetchTwitchUserData(accessToken) {
      try {
        const response = await fetch('https://api.twitch.tv/helix/users', {
          headers: {
            'Client-ID': CLIENT_ID,
            'Authorization': `Bearer ${accessToken}`
          }
        });
        const data = await response.json();
        return data.data[0];
      } catch (err) {
        console.error('Failed to fetch user profile:', err);
      }
    }

    async function init() {
      const token = getAccessTokenFromUrl();

      if (token) {
        // Clear hash from URL cleanly without reloading page
        history.replaceState(null, null, ' ');

        // Fetch user info from Twitch Helix API
        const user = await fetchTwitchUserData(token);

        if (user) {
          document.getElementById('welcome-msg').textContent = user.display_name;
          document.getElementById('user-avatar').src = user.profile_image_url;
        }

        // Show discovery view
        loginView.classList.add('hidden');
        discoveryView.classList.remove('hidden');
      }
    }

    init();
  </script>
</body>
</html>
