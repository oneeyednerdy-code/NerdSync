<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NerdSync - Better Twitch Discovery</title>
  <style>
    :root {
      --bg: #0e0e10;
      --panel: #18181b;
      --panel-2: #1f1f23;
      --border: #26262c;
      --text: #efeff1;
      --text-dim: #adadb8;
      --accent: #9146ff;
      --accent-hover: #772ce8;
      --live: #eb0400;
      --focus: #bf94ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Roobert, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    button { font: inherit; }

    /* --- LOGIN VIEW --- */
    #login-view {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .login-card {
      background-color: var(--panel);
      padding: 2.5rem;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .brand-header h1 {
      color: var(--accent);
      font-size: 1.8rem;
      margin-top: 0.75rem;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .brand-header p {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }

    .btn-twitch {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--accent);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s;
    }

    .btn-twitch:hover { background-color: var(--accent-hover); }

    .config-warning {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #f2a33c;
      line-height: 1.4;
    }

    /* --- DISCOVERY VIEW --- */
    .discovery-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #3a3a3d;
      object-fit: cover;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.45rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-logout:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      background: var(--panel);
      padding: 0.25rem;
      border-radius: 6px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .search-input {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.9rem;
      border-radius: 6px;
      min-width: 220px;
      font-size: 0.9rem;
    }

    .search-input::placeholder { color: var(--text-dim); }

    .status-msg {
      color: var(--text-dim);
      padding: 3rem 0;
      text-align: center;
      font-size: 0.95rem;
    }

    .status-msg.error { color: #f2a33c; }

    .stream-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .stream-card {
      background-color: var(--panel);
      border-radius: 6px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .stream-card:hover, .stream-card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    .thumbnail {
      width: 100%;
      height: 150px;
      background-color: var(--panel-2);
      position: relative;
      display: block;
      object-fit: cover;
    }

    .live-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background-color: var(--live);
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .viewer-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .thumb-wrap { position: relative; }

    .stream-info { padding: 1rem; }

    .stream-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .streamer-name { font-size: 0.85rem; color: var(--text); font-weight: 600; }
    .game-name { font-size: 0.82rem; color: var(--text-dim); margin-top: 0.15rem; }

    /* --- RESPONSIVE --- */
    @media (max-width: 600px) {
      .login-card { padding: 1.75rem 1.5rem; }
      .discovery-container { padding: 1.25rem; }
      .top-bar { gap: 0.75rem; }
      .user-profile { gap: 0.5rem; }
      #welcome-msg { display: none; } /* avatar + logout is enough on narrow screens */
      .controls-bar { flex-direction: column; align-items: stretch; }
      .search-input { min-width: 0; width: 100%; }
      .tabs { width: 100%; }
      .tab-btn { flex: 1; }
      .stream-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
      .stream-title { font-size: 0.88rem; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="login-view">
    <div class="login-card">
      <div class="brand-header">
        <svg height="40" viewBox="0 0 40 40" width="40" fill="#9146ff" aria-hidden="true"><path d="M10 6L6 10v20h8v4h4l4-4h6l8-8V6H10zm24 16l-4 4h-6l-4 4v-4h-4V8h18v14zM28 12h-3v8h3v-8zm-8 0h-3v8h3v-8z"/></svg>
        <h1>NerdSync</h1>
        <p>Your live channels, all in one place.</p>
      </div>
      <button id="twitch-login-btn" class="btn-twitch">
        <svg height="20" viewBox="0 0 40 40" width="20" fill="#ffffff" aria-hidden="true"><path d="M10 6L6 10v20h8v4h4l4-4h6l8-8V6H10zm24 16l-4 4h-6l-4 4v-4h-4V8h18v14zM28 12h-3v8h3v-8zm-8 0h-3v8h3v-8z"/></svg>
        Log in with Twitch
      </button>
      <p id="config-warning" class="config-warning hidden">
        No Twitch Client ID is set yet. Add yours to <code>config.js</code> before logging in.
      </p>
    </div>
  </div>

  <!-- DISCOVERY SECTION -->
  <div id="discovery-view" class="discovery-container hidden">
    <div class="top-bar">
      <div class="brand-mini">
        <svg height="22" viewBox="0 0 40 40" width="22" fill="#9146ff" aria-hidden="true"><path d="M10 6L6 10v20h8v4h4l4-4h6l8-8V6H10zm24 16l-4 4h-6l-4 4v-4h-4V8h18v14zM28 12h-3v8h3v-8zm-8 0h-3v8h3v-8z"/></svg>
        NerdSync
      </div>
      <div class="user-profile">
        <img id="user-avatar" class="user-avatar" src="" alt="" />
        <span id="welcome-msg" style="color: var(--text-dim);"></span>
        <button id="logout-btn" class="btn-logout">Log out</button>
      </div>
    </div>

    <div class="controls-bar">
      <div class="tabs" role="tablist" aria-label="Stream lists">
        <button id="tab-following" class="tab-btn active" role="tab" aria-selected="true">Following</button>
        <button id="tab-discover" class="tab-btn" role="tab" aria-selected="false">Discover</button>
      </div>
      <input id="search-input" class="search-input" type="search" placeholder="Filter by streamer or game…" aria-label="Filter streams" />
    </div>

    <div id="status-area"></div>
    <div id="stream-grid" class="stream-grid"></div>
  </div>

  <script src="config.js"></script>
  <script>
    // --- CONFIGURATION ---
    // Set your Client ID in config.js, not here.
    const CLIENT_ID = (typeof CONFIG !== 'undefined' && CONFIG.TWITCH_CLIENT_ID) || '';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'user:read:email user:read:follows';
    const STORAGE_KEY = 'nerdsync_token';

    const loginView = document.getElementById('login-view');
    const discoveryView = document.getElementById('discovery-view');
    const loginBtn = document.getElementById('twitch-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const configWarning = document.getElementById('config-warning');
    const tabFollowing = document.getElementById('tab-following');
    const tabDiscover = document.getElementById('tab-discover');
    const searchInput = document.getElementById('search-input');
    const statusArea = document.getElementById('status-area');
    const streamGrid = document.getElementById('stream-grid');

    let currentUser = null;
    let currentToken = null;
    let activeTab = 'following';
    let allStreams = [];

    // --- Config guard ---
    if (!CLIENT_ID || CLIENT_ID === 'YOUR_TWITCH_CLIENT_ID_HERE') {
      loginBtn.disabled = true;
      loginBtn.style.opacity = '0.5';
      loginBtn.style.cursor = 'not-allowed';
      configWarning.classList.remove('hidden');
    }

    // --- Login ---
    loginBtn.addEventListener('click', () => {
      const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(SCOPES)}`;
      window.location.href = authUrl;
    });

    // --- Logout ---
    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem(STORAGE_KEY);
      currentToken = null;
      currentUser = null;
      discoveryView.classList.add('hidden');
      loginView.classList.remove('hidden');
    });

    // --- Tabs ---
    function setActiveTab(tab) {
      activeTab = tab;
      tabFollowing.classList.toggle('active', tab === 'following');
      tabDiscover.classList.toggle('active', tab === 'discover');
      tabFollowing.setAttribute('aria-selected', tab === 'following');
      tabDiscover.setAttribute('aria-selected', tab === 'discover');
      loadStreams();
    }
    tabFollowing.addEventListener('click', () => setActiveTab('following'));
    tabDiscover.addEventListener('click', () => setActiveTab('discover'));

    searchInput.addEventListener('input', () => renderStreams());

    // --- Token handling ---
    function getAccessTokenFromUrl() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    async function validateToken(token) {
      const res = await fetch('https://id.twitch.tv/oauth2/validate', {
        headers: { Authorization: `OAuth ${token}` }
      });
      if (!res.ok) return null;
      return res.json(); // { user_id, login, client_id, expires_in, ... }
    }

    async function fetchTwitchUserData(token) {
      const res = await fetch('https://api.twitch.tv/helix/users', {
        headers: { 'Client-ID': CLIENT_ID, Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Failed to load profile');
      const data = await res.json();
      return data.data[0];
    }

    async function fetchFollowedStreams(userId, token) {
      const res = await fetch(`https://api.twitch.tv/helix/streams/followed?user_id=${userId}&first=40`, {
        headers: { 'Client-ID': CLIENT_ID, Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Failed to load followed streams');
      const data = await res.json();
      return data.data;
    }

    async function fetchTopStreams(token) {
      const res = await fetch('https://api.twitch.tv/helix/streams?first=40', {
        headers: { 'Client-ID': CLIENT_ID, Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Failed to load streams');
      const data = await res.json();
      return data.data;
    }

    // --- Rendering ---
    function setStatus(message, isError) {
      statusArea.innerHTML = message
        ? `<p class="status-msg${isError ? ' error' : ''}">${message}</p>`
        : '';
    }

    function renderStreams() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = query
        ? allStreams.filter(s =>
            s.user_name.toLowerCase().includes(query) ||
            (s.game_name || '').toLowerCase().includes(query))
        : allStreams;

      if (filtered.length === 0) {
        streamGrid.innerHTML = '';
        setStatus(
          allStreams.length === 0
            ? (activeTab === 'following'
                ? "None of the channels you follow are live right now. Try Discover to see what's trending."
                : 'No live streams to show right now.')
            : 'No streams match your filter.'
        );
        return;
      }

      setStatus('');
      streamGrid.innerHTML = filtered.map(streamCardHtml).join('');
    }

    function streamCardHtml(s) {
      const thumb = s.thumbnail_url
        .replace('{width}', '320')
        .replace('{height}', '180');
      const viewers = new Intl.NumberFormat().format(s.viewer_count);
      return `
        <a class="stream-card" href="https://twitch.tv/${encodeURIComponent(s.user_login)}" target="_blank" rel="noopener noreferrer">
          <div class="thumb-wrap">
            <img class="thumbnail" src="${thumb}" alt="" loading="lazy" />
            <span class="live-badge">Live</span>
            <span class="viewer-badge">${viewers} viewers</span>
          </div>
          <div class="stream-info">
            <p class="stream-title">${escapeHtml(s.title)}</p>
            <p class="streamer-name">${escapeHtml(s.user_name)}</p>
            <p class="game-name">${escapeHtml(s.game_name || 'No category')}</p>
          </div>
        </a>`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    async function loadStreams() {
      streamGrid.innerHTML = '';
      setStatus('Loading streams…');
      try {
        allStreams = activeTab === 'following'
          ? await fetchFollowedStreams(currentUser.id, currentToken)
          : await fetchTopStreams(currentToken);
        renderStreams();
      } catch (err) {
        console.error(err);
        setStatus('Something went wrong loading streams. Try refreshing the page.', true);
      }
    }

    // --- Session bootstrap ---
    async function showDiscoveryView() {
      document.getElementById('welcome-msg').textContent = currentUser.display_name;
      document.getElementById('user-avatar').src = currentUser.profile_image_url;
      document.getElementById('user-avatar').alt = `${currentUser.display_name}'s avatar`;
      loginView.classList.add('hidden');
      discoveryView.classList.remove('hidden');
      await loadStreams();
    }

    async function trySession(token) {
      const validation = await validateToken(token);
      if (!validation) {
        sessionStorage.removeItem(STORAGE_KEY);
        return false;
      }
      currentToken = token;
      sessionStorage.setItem(STORAGE_KEY, token);
      currentUser = await fetchTwitchUserData(token);
      currentUser.id = validation.user_id;
      await showDiscoveryView();
      return true;
    }

    async function init() {
      const urlToken = getAccessTokenFromUrl();

      if (urlToken) {
        history.replaceState(null, null, ' ');
        const ok = await trySession(urlToken);
        if (ok) return;
      }

      const storedToken = sessionStorage.getItem(STORAGE_KEY);
      if (storedToken) {
        await trySession(storedToken);
      }
    }

    init();
  </script>
</body>
</html>
