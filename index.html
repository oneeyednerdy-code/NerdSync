<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nerd Sync | Twitch Dashboard</title>
  <script src="config.js"></script>
  <style>
    :root {
      --bg-color: #0b0914;
      --card-bg: #161224;
      --card-hover: #211b36;
      --accent-purple: #8b5cf6;
      --accent-purple-glow: #a78bfa;
      --accent-hover: #7c3aed;
      --text-main: #f3f0ff;
      --text-muted: #9ca3af;
      --border-color: #2e2647;
      --live-badge: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .d20-logo {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: var(--accent-purple);
      stroke-width: 1.8;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.5));
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    h1 span {
      color: var(--accent-purple);
    }

    .btn {
      background-color: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
    }

    .btn:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.5);
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 36px 0 16px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-purple-glow);
    }

    .badge-live {
      background: var(--live-badge);
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-3px);
      background-color: var(--card-hover);
      border-color: var(--accent-purple);
    }

    .thumbnail-wrapper {
      width: 100%;
      position: relative;
      background-color: #000;
    }

    .thumbnail-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fff;
    }

    .card-meta {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .card-btn {
      margin-top: auto;
      padding-top: 12px;
    }

    .twitch-link {
      display: block;
      text-align: center;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid var(--accent-purple);
      color: var(--text-main);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .twitch-link:hover {
      background: var(--accent-purple);
      color: #fff;
    }

    .empty-state {
      color: var(--text-muted);
      font-style: italic;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg class="d20-logo" viewBox="0 0 100 100">
        <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" />
        <line x1="50" y1="5" x2="50" y2="95" />
        <line x1="10" y1="25" x2="90" y2="25" />
        <line x1="10" y1="75" x2="90" y2="75" />
        <line x1="50" y1="5" x2="10" y2="75" />
        <line x1="50" y1="5" x2="90" y2="75" />
        <line x1="10" y1="25" x2="50" y2="95" />
        <line x1="90" y1="25" x2="50" y2="95" />
        <polygon points="50,25 75,50 50,75 25,50" />
      </svg>
      <h1>Nerd <span>Sync</span></h1>
    </div>
    <button id="auth-btn" class="btn">Log in with Twitch</button>
  </header>

  <section>
    <h2 class="section-title"><span class="badge-live">LIVE</span> Followed Streamers</h2>
    <div id="live-section" class="grid"><p class="empty-state">Log in to view live streamers.</p></div>
  </section>

  <section>
    <h2 class="section-title">Followed Clips (Horizontal)</h2>
    <div id="clips-section" class="grid"><p class="empty-state">Log in to view clips.</p></div>
  </section>

  <section>
    <h2 class="section-title">Vertical Clips (Shorts / Reels)</h2>
    <div id="vertical-clips-section" class="grid"><p class="empty-state">Log in to view vertical clips.</p></div>
  </section>

  <section>
    <h2 class="section-title">Offline Streamers & Upcoming Schedules</h2>
    <div id="offline-section" class="grid"><p class="empty-state">Log in to view offline channels.</p></div>
  </section>

  <script>
    const clientId = (typeof CONFIG !== 'undefined' && CONFIG.TWITCH_CLIENT_ID) ? CONFIG.TWITCH_CLIENT_ID : '';
    const authBtn = document.getElementById('auth-btn');

    const redirectUri = window.location.origin + window.location.pathname;
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const token = hashParams.get('access_token');

    authBtn.onclick = () => {
      if (!clientId || clientId === 'YOUR_TWITCH_CLIENT_ID_HERE') {
        alert('Please configure your Twitch Client ID in config.js before logging in.');
        return;
      }
      const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=user:read:follows`;
      window.location.href = authUrl;
    };

    if (token) {
      authBtn.textContent = 'Logged In';
      authBtn.disabled = true;
      initDashboard(token);
    }

    async function twitchFetch(endpoint, token) {
      const res = await fetch(`https://api.twitch.tv/helix/${endpoint}`, {
        headers: {
          'Client-ID': clientId,
          'Authorization': `Bearer ${token}`
        }
      });
      if (!res.ok) throw new Error(`API Error: ${res.status}`);
      return await res.json();
    }

    async function initDashboard(accessToken) {
      try {
        const userRes = await twitchFetch('users', accessToken);
        const userId = userRes.data[0].id;

        const liveRes = await twitchFetch(`streams/followed?user_id=${userId}`, accessToken);
        const liveUsers = liveRes.data || [];
        renderLive(liveUsers);

        const followsRes = await twitchFetch(`channels/followed?user_id=${userId}`, accessToken);
        const followedChannels = followsRes.data || [];

        const liveIds = new Set(liveUsers.map(s => s.user_id));
        const offlineUsers = followedChannels.filter(c => !liveIds.has(c.broadcaster_id));

        renderOffline(offlineUsers, accessToken);

        if (followedChannels.length > 0) {
          fetchAndRenderClips(followedChannels, accessToken);
        }

      } catch (err) {
        console.error('Error fetching Twitch data:', err);
      }
    }

    function renderLive(streams) {
      const container = document.getElementById('live-section');
      if (streams.length === 0) {
        container.innerHTML = '<p class="empty-state">No followed channels are currently live.</p>';
        return;
      }
      container.innerHTML = streams.map(s => {
        const thumb = s.thumbnail_url.replace('{width}', '440').replace('{height}', '248');
        return `
          <div class="card">
            <div class="thumbnail-wrapper">
              <img src="${thumb}" alt="${s.user_name} thumbnail">
            </div>
            <div class="card-body">
              <div class="card-title">${s.user_name}</div>
              <div class="card-meta">Game: ${s.game_name}</div>
              <div class="card-meta">Viewers: ${s.viewer_count.toLocaleString()}</div>
              <div class="card-btn">
                <a class="twitch-link" href="https://twitch.tv/${s.user_login}" target="_blank">Open on Twitch &rarr;</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function renderOffline(offlineUsers, accessToken) {
      const container = document.getElementById('offline-section');
      if (offlineUsers.length === 0) {
        container.innerHTML = '<p class="empty-state">No offline channels found.</p>';
        return;
      }

      container.innerHTML = '';
      for (const user of offlineUsers.slice(0, 12)) {
        let scheduleText = 'No upcoming schedule';
        try {
          const schedRes = await twitchFetch(`schedule?broadcaster_id=${user.broadcaster_id}`, accessToken);
          const nextStream = schedRes.data?.segments?.[0]?.start_time;
          if (nextStream) {
            scheduleText = `Next stream: ${new Date(nextStream).toLocaleString()}`;
          }
        } catch (e) {}

        container.innerHTML += `
          <div class="card">
            <div class="card-body">
              <div class="card-title">${user.broadcaster_name}</div>
              <div class="card-meta">Status: Offline</div>
              <div class="card-meta"><small>${scheduleText}</small></div>
              <div class="card-btn">
                <a class="twitch-link" href="https://twitch.tv/${user.broadcaster_login}" target="_blank">Open on Twitch &rarr;</a>
              </div>
            </div>
          </div>
        `;
      }
    }

    async function fetchAndRenderClips(followedChannels, accessToken) {
      const standardContainer = document.getElementById('clips-section');
      const verticalContainer = document.getElementById('vertical-clips-section');
      
      standardContainer.innerHTML = '';
      verticalContainer.innerHTML = '';

      let hasHorizontal = false;
      let hasVertical = false;

      for (const channel of followedChannels.slice(0, 5)) {
        try {
          const clipsRes = await twitchFetch(`clips?broadcaster_id=${channel.broadcaster_id}&first=5`, accessToken);
          const clips = clipsRes.data || [];

          clips.forEach(clip => {
            const isVertical = clip.height > clip.width;
            const target = isVertical ? verticalContainer : standardContainer;

            if (isVertical) hasVertical = true; else hasHorizontal = true;

            target.innerHTML += `
              <div class="card">
                <div class="thumbnail-wrapper">
                  <img src="${clip.thumbnail_url}" alt="${clip.title} thumbnail">
                </div>
                <div class="card-body">
                  <div class="card-title">${clip.title}</div>
                  <div class="card-meta">Broadcaster: ${clip.broadcaster_name}</div>
                  <div class="card-meta">Views: ${clip.view_count.toLocaleString()}</div>
                  <div class="card-btn">
                    <a class="twitch-link" href="${clip.url}" target="_blank">Open on Twitch &rarr;</a>
                  </div>
                </div>
              </div>
            `;
          });
        } catch (e) {
          console.error(e);
        }
      }

      if (!hasHorizontal) standardContainer.innerHTML = '<p class="empty-state">No horizontal clips found.</p>';
      if (!hasVertical) verticalContainer.innerHTML = '<p class="empty-state">No vertical clips found.</p>';
    }
  </script>
</body>
</html>
