<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NerdSync - Better Twitch Discovery</title>
<style>
:root {
  --bg: #0e0e10;
  --panel: #18181b;
  --panel-2: #1f1f23;
  --border: #26262c;
  --text: #efeff1;
  --text-dim: #adadb8;
  --accent: #9146ff;
  --accent-hover: #772ce8;
  --live: #eb0400;
  --focus: #bf94ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, Roobert, "Helvetica Neue", Helvetica, Arial, sans-serif; }
body { background-color: var(--bg); color: var(--text); min-height: 100vh; }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; }

.logo-nerd { color: var(--accent); }
.logo-sync { color: #ffffff; }

/* --- LOGIN VIEW --- */
#login-view { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
.login-card { background-color: var(--panel); padding: 2.5rem; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; }
.brand-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.4rem; }
.brand-header p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1.75rem; }
.btn-twitch { width: 100%; padding: 0.8rem; background-color: var(--accent); border: none; border-radius: 4px; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: background-color 0.2s; }
.btn-twitch:hover { background-color: var(--accent-hover); }
.config-warning { margin-top: 1.25rem; font-size: 0.8rem; color: #f2a33c; line-height: 1.4; }

/* --- DISCOVERY VIEW --- */
.discovery-container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 2rem; }
.top-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
.brand-mini { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.03em; }
.user-profile { display: flex; align-items: center; gap: 0.75rem; }
.user-avatar { width: 36px; height: 36px; border-radius: 50%; background-color: #3a3a3d; object-fit: cover; }
.btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 0.45rem 0.9rem; border-radius: 4px; cursor: pointer; transition: border-color 0.2s, color 0.2s; white-space: nowrap; }
.btn-logout:hover { border-color: var(--text-dim); color: var(--text); }
.btn-logout:disabled { opacity: 0.4; cursor: default; }

.controls-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
.tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; background: var(--panel); padding: 0.25rem; border-radius: 6px; }
.tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.88rem; white-space: nowrap; transition: background-color 0.2s, color 0.2s; }
.tab-btn.active { background: var(--accent); color: #fff; }
.search-row { display: flex; align-items: center; gap: 0.5rem; }
.search-input { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 0.55rem 0.9rem; border-radius: 6px; min-width: 220px; font-size: 0.9rem; }
.search-input::placeholder { color: var(--text-dim); }
.btn-refresh { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
.btn-refresh:hover { border-color: var(--text-dim); color: var(--text); }
.btn-refresh.spinning svg { animation: spin 0.6s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

.filter-toggle-row { margin-bottom: 0.75rem; }
.filters-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; margin-left: 6px; background: var(--accent); color: #fff; border-radius: 999px; font-size: 0.7rem; font-weight: 700; padding: 0 4px; }
.filter-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; align-items: end; }
.filter-group label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 0.35rem; font-weight: 600; }
.filter-group input, .filter-group select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.7rem; border-radius: 6px; font-size: 0.88rem; }
.filter-row-inline { display: flex; gap: 0.75rem; }
.filter-row-inline > div { flex: 1; }
.genre-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.pill { background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
.pill.active, .pill:hover { border-color: var(--accent); color: var(--text); }
.pill.active { background: var(--accent); color: #fff; }
#clear-filters-btn { align-self: end; height: fit-content; }

.clip-sort-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; align-items: center; }
.sort-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); padding: 0.4rem 0.9rem; border-radius: 999px; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: border-color 0.2s, color 0.2s, background-color 0.2s; }
.sort-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.sort-btn:not(.active):hover { border-color: var(--text-dim); color: var(--text); }

.tab-explainer { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 1.5rem; line-height: 1.5; }
.status-msg { color: var(--text-dim); padding: 3rem 0; text-align: center; font-size: 0.95rem; line-height: 1.5; }
.status-msg.error { color: #f2a33c; }

.stream-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
.stream-card { background-color: var(--panel); border-radius: 6px; overflow: hidden; text-decoration: none; color: inherit; display: block; transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; }
.stream-card:hover, .stream-card:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
.thumbnail { width: 100%; height: 150px; background-color: var(--panel-2); display: block; object-fit: cover; }
.thumb-wrap { position: relative; }
.live-badge { position: absolute; top: 8px; left: 8px; background-color: var(--live); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
.viewer-badge { position: absolute; bottom: 8px; left: 8px; background-color: rgba(0,0,0,0.7); color: #fff; font-size: 0.75rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.duration-badge { position: absolute; bottom: 8px; right: 8px; background-color: rgba(0,0,0,0.7); color: #fff; font-size: 0.75rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.status-badge { position: absolute; top: 8px; right: 8px; background-color: rgba(0,0,0,0.7); color: #fff; font-size: 0.7rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; text-transform: capitalize; }
.stream-info { padding: 1rem; }
.stream-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.4rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.streamer-name { font-size: 0.85rem; color: var(--text); font-weight: 600; }
.game-name { font-size: 0.82rem; color: var(--text-dim); margin-top: 0.15rem; }
.clip-meta { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.3rem; }
.via-tag { display: inline-block; margin-top: 0.5rem; margin-right: 0.3rem; font-size: 0.75rem; color: var(--accent); background: rgba(145,70,255,0.12); padding: 2px 8px; border-radius: 999px; }

.pagination-controls { display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
.page-indicator { color: var(--text-dim); font-size: 0.85rem; }

/* --- MODAL --- */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 100; }
.modal-panel { background: var(--panel); border-radius: 10px; width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; padding: 1.75rem; position: relative; }
.modal-close { position: absolute; top: 1rem; right: 1rem; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; line-height: 1; }
.modal-header { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 0.9rem; padding-right: 2.5rem; }
.modal-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--panel-2); flex-shrink: 0; }
.modal-streamer { font-weight: 700; font-size: 1.1rem; }
.modal-category { color: var(--text-dim); font-size: 0.88rem; }
.modal-title-text { font-size: 0.95rem; margin-bottom: 0.75rem; line-height: 1.4; }
.modal-stats-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; }
.modal-stat { color: var(--text-dim); font-size: 0.85rem; }
.modal-tags { margin-bottom: 1rem; }
.modal-watch-btn { display: inline-flex; width: auto; padding: 0.6rem 1.3rem; margin-bottom: 1.5rem; text-decoration: none; }
.modal-section { margin-top: 1.5rem; }
.modal-section h3 { font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.75rem; }
.modal-mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
.mini-card { background: var(--panel-2); border-radius: 6px; overflow: hidden; text-decoration: none; color: inherit; display: block; transition: transform 0.15s; }
.mini-card:not(.static):hover { transform: translateY(-2px); }
.mini-card img { width: 100%; height: 80px; object-fit: cover; display: block; }
.mini-card.static { padding: 0.7rem; }
.mini-title { display: block; font-size: 0.78rem; font-weight: 600; padding: 0.5rem 0.6rem 0.1rem; line-height: 1.3; }
.mini-meta { display: block; font-size: 0.72rem; color: var(--text-dim); padding: 0 0.6rem 0.6rem; }

@media (max-width: 600px) {
  .login-card { padding: 1.75rem 1.5rem; }
  .discovery-container { padding: 1.25rem; }
  .top-bar { gap: 0.75rem; }
  .user-profile { gap: 0.5rem; }
  #welcome-msg { display: none; }
  .controls-bar { flex-direction: column; align-items: stretch; }
  .search-row { width: 100%; }
  .search-input { min-width: 0; width: 100%; }
  .tabs { width: 100%; }
  .tab-btn { flex: 1 1 auto; text-align: center; }
  .stream-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
  .stream-title { font-size: 0.88rem; }
  .clip-sort-row { flex-wrap: wrap; }
  .sort-btn { flex: 1; text-align: center; }
  .filter-panel { grid-template-columns: 1fr; }
  .modal-panel { padding: 1.25rem; }
}
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <div class="brand-header">
      <h1><span class="logo-nerd">Nerd</span><span class="logo-sync">Sync</span></h1>
      <p>Your live channels, all in one place.</p>
    </div>
    <button id="twitch-login-btn" class="btn-twitch">Log in with Twitch</button>
    <p id="config-warning" class="config-warning hidden">No Twitch Client ID is set yet. Add yours to <code>config.js</code> before logging in.</p>
  </div>
</div>

<div id="discovery-view" class="discovery-container hidden">
  <div class="top-bar">
    <div class="brand-mini"><span class="logo-nerd">Nerd</span><span class="logo-sync">Sync</span></div>
    <div class="user-profile">
      <img id="user-avatar" class="user-avatar" src="" alt="" />
      <span id="welcome-msg" style="color: var(--text-dim);"></span>
      <button id="logout-btn" class="btn-logout">Log out</button>
    </div>
  </div>

  <div class="controls-bar">
    <div class="tabs" role="tablist" aria-label="Stream lists">
      <button id="tab-following" class="tab-btn active" role="tab" aria-selected="true">Following</button>
      <button id="tab-teammates" class="tab-btn" role="tab" aria-selected="false">Teammates</button>
      <button id="tab-gems" class="tab-btn" role="tab" aria-selected="false">Hidden Gems</button>
      <button id="tab-rising" class="tab-btn" role="tab" aria-selected="false">Rising Stars</button>
      <button id="tab-clips" class="tab-btn" role="tab" aria-selected="false">Clips</button>
      <button id="tab-discover" class="tab-btn" role="tab" aria-selected="false">Discover</button>
    </div>
    <div class="search-row">
      <input id="search-input" class="search-input" type="search" placeholder="Filter by streamer or game…" aria-label="Filter streams" />
      <button id="refresh-btn" class="btn-refresh" type="button" title="Refresh this tab's data" aria-label="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
  </div>

  <div id="filter-toggle-row" class="filter-toggle-row hidden">
    <button id="filters-toggle-btn" class="btn-logout" type="button">Filters<span id="filters-badge" class="filters-badge hidden">0</span></button>
  </div>

  <div id="filter-panel" class="filter-panel hidden">
    <div class="filter-group">
      <label for="filter-tag">Tag</label>
      <input id="filter-tag" type="text" placeholder="e.g. speedrun, cozy" />
    </div>
    <div class="filter-group" style="grid-column: span 2;">
      <label>Genre</label>
      <div id="genre-pills" class="genre-pills">
        <button class="pill active" data-genre="all" type="button">All</button>
        <button class="pill" data-genre="horror" type="button">Horror</button>
        <button class="pill" data-genre="mmo" type="button">MMO</button>
        <button class="pill" data-genre="rpg" type="button">RPG</button>
        <button class="pill" data-genre="shooter" type="button">Shooter</button>
        <button class="pill" data-genre="creative" type="button">Creative</button>
      </div>
    </div>
    <div class="filter-group">
      <label for="filter-min-viewers">Min viewers</label>
      <input id="filter-min-viewers" type="number" min="0" placeholder="0" />
    </div>
    <div class="filter-group">
      <label for="filter-max-viewers">Max viewers</label>
      <input id="filter-max-viewers" type="number" min="0" placeholder="Any" />
    </div>
    <div class="filter-group hidden" id="follow-age-group">
      <label for="filter-follow-days">Followed for at least (days)</label>
      <input id="filter-follow-days" type="number" min="0" placeholder="0" />
    </div>
    <button id="clear-filters-btn" class="btn-logout" type="button">Clear filters</button>
  </div>

  <div id="rising-controls-row" class="clip-sort-row hidden">
    <button id="rising-sort-viewers" class="sort-btn active" type="button">Most viewers</button>
    <button id="rising-sort-uptime" class="sort-btn" type="button">Longest uptime</button>
    <select id="rising-status-filter" class="search-input" style="min-width:170px;">
      <option value="all">All statuses</option>
      <option value="none">Non-affiliate</option>
      <option value="affiliate">Affiliate</option>
      <option value="partner">Partner</option>
    </select>
  </div>

  <div id="clip-sort-row" class="clip-sort-row hidden" role="group" aria-label="Sort clips">
    <button id="sort-top" class="sort-btn active" type="button">Most viewed</button>
    <button id="sort-new" class="sort-btn" type="button">Newest</button>
  </div>

  <p id="tab-explainer" class="tab-explainer hidden"></p>
  <div id="status-area"></div>
  <div id="stream-grid" class="stream-grid"></div>
  <div id="pagination-controls" class="pagination-controls"></div>
</div>

<div id="stream-modal" class="modal-overlay hidden">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-streamer">
    <button id="modal-close" class="modal-close" aria-label="Close" type="button">&times;</button>
    <div class="modal-header">
      <img id="modal-avatar" class="modal-avatar" src="" alt="" />
      <div>
        <p id="modal-streamer" class="modal-streamer"></p>
        <p id="modal-category" class="modal-category"></p>
      </div>
    </div>
    <p id="modal-title-text" class="modal-title-text"></p>
    <div class="modal-stats-row">
      <span id="modal-viewers" class="modal-stat"></span>
      <span id="modal-live-badge" class="live-badge hidden">Live</span>
    </div>
    <div id="modal-tags" class="modal-tags"></div>
    <a id="modal-watch-btn" class="btn-twitch modal-watch-btn" href="#" target="_blank" rel="noopener noreferrer">Watch on Twitch</a>
    <div class="modal-section">
      <h3>Recent Broadcasts</h3>
      <div id="modal-videos" class="modal-mini-grid"><p class="status-msg">Loading…</p></div>
    </div>
    <div class="modal-section">
      <h3>Recent Clips</h3>
      <div id="modal-clips" class="modal-mini-grid"><p class="status-msg">Loading…</p></div>
    </div>
    <div class="modal-section">
      <h3>Upcoming Schedule</h3>
      <div id="modal-schedule" class="modal-mini-grid"><p class="status-msg">Loading…</p></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
'use strict';

// --- CONFIGURATION ---
const CLIENT_ID = (typeof CONFIG !== 'undefined' && CONFIG.TWITCH_CLIENT_ID) || '';
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = 'user:read:email user:read:follows';
const STORAGE_KEY = 'nerdsync_token';

// Tuning knobs — kept small to stay well under Twitch's Helix rate limits.
const MAX_SEED_STREAMERS_FOR_TEAMMATES = 8;
const MAX_SEED_CATEGORIES_FOR_GEMS = 5;
const GEMS_PER_CATEGORY = 6;
const SMALL_STREAM_VIEWER_CEILING = 75;
const MAX_TOP_CATEGORIES_FOR_DISCOVER = 6;
const STREAMS_PER_CATEGORY_DISCOVER = 10;
const RISING_STARS_LOOKBACK_DAYS = 30;
const MAX_TOP_CATEGORIES_FOR_RISING = 6;
const MAX_RISING_CANDIDATES = 100;
const CLIPS_LOOKBACK_DAYS = 30;
const MAX_SEED_STREAMERS_FOR_CLIPS = 20;
const CLIPS_PER_STREAMER = 20;
const CACHE_TTL_MS = 3 * 60 * 1000;
const MODAL_CACHE_TTL_MS = 5 * 60 * 1000;
const PAGE_SIZE = 12;
const DEBOUNCE_MS = 300;

// Client-side genre approximation (see chat note: IGDB needs a server-side
// secret we can't safely hold in a static front end, so this is a curated
// keyword match against Twitch's own category names instead).
const GENRE_KEYWORDS = {
  horror: ['horror', 'resident evil', 'silent hill', 'dead by daylight', 'phasmophobia', 'outlast', 'five nights', 'until dawn'],
  mmo: ['world of warcraft', 'final fantasy xiv', 'elder scrolls online', 'guild wars', 'runescape', 'new world', 'lost ark', 'albion'],
  rpg: ['elden ring', "baldur's gate", 'dark souls', 'diablo', 'path of exile', 'witcher', 'skyrim', 'final fantasy', 'persona', 'dragon age'],
  shooter: ['valorant', 'call of duty', 'counter-strike', 'apex legends', 'overwatch', 'fortnite', 'pubg', 'rainbow six', 'destiny'],
  creative: ['just chatting', 'art', 'music', 'talk shows', 'food & drink', 'makers & crafting', 'asmr', 'special events']
};

const loginView = document.getElementById('login-view');
const discoveryView = document.getElementById('discovery-view');
const loginBtn = document.getElementById('twitch-login-btn');
const logoutBtn = document.getElementById('logout-btn');
const configWarning = document.getElementById('config-warning');
const searchInput = document.getElementById('search-input');
const refreshBtn = document.getElementById('refresh-btn');
const statusArea = document.getElementById('status-area');
const streamGrid = document.getElementById('stream-grid');
const tabExplainer = document.getElementById('tab-explainer');
const clipSortRow = document.getElementById('clip-sort-row');
const sortTopBtn = document.getElementById('sort-top');
const sortNewBtn = document.getElementById('sort-new');
const filterToggleRow = document.getElementById('filter-toggle-row');
const filterPanel = document.getElementById('filter-panel');
const filtersToggleBtn = document.getElementById('filters-toggle-btn');
const filtersBadge = document.getElementById('filters-badge');
const followAgeGroup = document.getElementById('follow-age-group');
const tagInput = document.getElementById('filter-tag');
const minViewersInput = document.getElementById('filter-min-viewers');
const maxViewersInput = document.getElementById('filter-max-viewers');
const followDaysInput = document.getElementById('filter-follow-days');
const genrePillsEl = document.getElementById('genre-pills');
const clearFiltersBtn = document.getElementById('clear-filters-btn');
const risingControlsRow = document.getElementById('rising-controls-row');
const paginationControls = document.getElementById('pagination-controls');
const streamModal = document.getElementById('stream-modal');

const TABS = {
  following: {
    el: document.getElementById('tab-following'),
    explainer: 'Channels you follow that are live right now.',
    empty: "None of the channels you follow are live right now. Try Discover to see what's trending.",
    load: loadFollowing,
    hasCommonFilters: true
  },
  teammates: {
    el: document.getElementById('tab-teammates'),
    explainer: "Twitch doesn't let apps see who another streamer follows, so this is the closest real substitute: live members of official Twitch Teams that your followed streamers belong to.",
    empty: "None of your live followed streamers are on a public Twitch Team, so there are no teammates to surface yet.",
    load: loadTeammates,
    hasCommonFilters: true
  },
  gems: {
    el: document.getElementById('tab-gems'),
    explainer: `Small channels (under ${SMALL_STREAM_VIEWER_CEILING} viewers) playing the same games your followed streamers are live in right now.`,
    empty: "Follow and watch a few live channels first — Hidden Gems is built from the categories they're currently playing.",
    load: loadHiddenGems,
    hasCommonFilters: true
  },
  rising: {
    el: document.getElementById('tab-rising'),
    explainer: `Channels playing today's top categories whose Twitch account was created in the last ${RISING_STARS_LOOKBACK_DAYS} days. Twitch's API has no "first stream" field, so account-creation date is the closest available signal — treat this as a rough cut, not a precise one.`,
    empty: "No live channels matched a recently-created account in today's top categories right now — results here will naturally be sparse.",
    load: loadRisingStars,
    hasCommonFilters: true,
    isRising: true
  },
  clips: {
    el: document.getElementById('tab-clips'),
    explainer: `Clips from the last ${CLIPS_LOOKBACK_DAYS} days, pulled from up to ${MAX_SEED_STREAMERS_FOR_CLIPS} of the channels you follow.`,
    empty: `No clips from your followed channels in the last ${CLIPS_LOOKBACK_DAYS} days.`,
    load: loadClips,
    isClips: true
  },
  discover: {
    el: document.getElementById('tab-discover'),
    explainer: `Small channels (under ${SMALL_STREAM_VIEWER_CEILING} viewers) across today's top Twitch categories — the channels Twitch's own front page buries under the biggest streamers.`,
    empty: 'No small channels found in the top categories right now.',
    load: loadDiscover,
    hasCommonFilters: true
  }
};

let currentUser = null;
let currentToken = null;
let activeTab = 'following';
let currentPage = 1;
let allStreams = [];
let followedLiveCache = null;
let followedChannelsCache = null;
let tabCache = {};
let modalDetailCache = {};
let clipSort = 'views';
let risingSort = 'viewers';
let risingStatusFilter = 'all';
let filters = { tag: '', genre: 'all', minViewers: null, maxViewers: null, minFollowDays: null };
const cardDataById = new Map();

// --- Config guard ---
if (!CLIENT_ID || CLIENT_ID === 'YOUR_TWITCH_CLIENT_ID_HERE') {
  loginBtn.disabled = true;
  loginBtn.style.opacity = '0.5';
  loginBtn.style.cursor = 'not-allowed';
  configWarning.classList.remove('hidden');
}

function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

// --- Login / logout ---
loginBtn.addEventListener('click', () => {
  const authUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(SCOPES)}`;
  window.location.href = authUrl;
});

logoutBtn.addEventListener('click', () => {

  currentToken = null;
  currentUser = null;
  followedLiveCache = null;

// --- Tabs ---
function setActiveTab(tabId) {
  activeTab = tabId;
  currentPage = 1;
  const cfg = TABS[tabId];
  Object.entries(TABS).forEach(([id, tab]) => {
    tab.el.classList.toggle('active', id === tabId);

  });

  clipSortRow.classList.toggle('hidden', !cfg.isClips);
  risingControlsRow.classList.toggle('hidden', !cfg.isRising);
  filterToggleRow.classList.toggle('hidden', !cfg.hasCommonFilters);
  if (!cfg.hasCommonFilters) filterPanel.classList.add('hidden');
  followAgeGroup.classList.toggle('hidden', tabId !== 'following');

}
Object.entries(TABS).forEach(([id, tab]) => tab.el.addEventListener('click', () => setActiveTab(id)));

searchInput.addEventListener('input', debounce(() => { currentPage = 1; renderGrid(); }, DEBOUNCE_MS));

refreshBtn.addEventListener('click', () => {

sortTopBtn.addEventListener('click', () => setClipSort('views'));

filtersToggleBtn.addEventListener('click', () => filterPanel.classList.toggle('hidden'));

tagInput.addEventListener('input', debounce(() => {

function numOrNull(val) {
  const n = parseInt(val, 10);
  return Number.isNaN(n) ? null : n;
}

minViewersInput.addEventListener('input', debounce(() => {
  filters.minViewers = numOrNull(minViewersInput.value);
  currentPage = 1;
  updateFiltersBadge();
  renderGrid();

maxViewersInput.addEventListener('input', debounce(() => {

}, DEBOUNCE_MS));

followDaysInput.addEventListener('input', debounce(() => {

}, DEBOUNCE_MS));

genrePillsEl.addEventListener('click', e => {

clearFiltersBtn.addEventListener('click', () => {
  filters = { tag: '', genre: 'all', minViewers: null, maxViewers: null, minFollowDays: null };
  tagInput.value = '';
  minViewersInput.value = '';
  maxViewersInput.value = '';
  followDaysInput.value = '';

function updateFiltersBadge() {
  const count = [filters.tag, filters.genre !== 'all', filters.minViewers != null, filters.maxViewers != null, filters.minFollowDays != null].filter(Boolean).length;
  filtersBadge.textContent = String(count);
  filtersBadge.classList.toggle('hidden', count === 0);
}

function matchesGenre(gameName, genreKey) {
  if (!gameName) return false;
  const name = gameName.toLowerCase();
  const keywords = GENRE_KEYWORDS[genreKey] || [];
  return keywords.some(k => name.includes(k));
}

function passesCommonFilters(s) {
  if (filters.tag) {
    const tags = s.tags || [];
    if (!tags.some(t => t.toLowerCase().includes(filters.tag))) return false;
  }
  if (filters.genre !== 'all' && !matchesGenre(s.game_name, filters.genre)) return false;
  if (filters.minViewers != null && s.viewer_count < filters.minViewers) return false;
  if (filters.maxViewers != null && s.viewer_count > filters.maxViewers) return false;
  if (filters.minFollowDays != null && activeTab === 'following') {
    const days = s._followedAt ? (Date.now() - new Date(s._followedAt).getTime()) / 86400000 : null;
    if (days == null || days < filters.minFollowDays) return false;
  }
  return true;
}

// --- Token handling ---
function getAccessTokenFromUrl() {
  const params = new URLSearchParams(window.location.hash.substring(1));
  return params.get('access_token');
}

async function validateToken(token) {
  const res = await fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: `OAuth ${token}` } });
  if (!res.ok) return null;
  return res.json();
}

function authHeaders(token) {
  return { 'Client-ID': CLIENT_ID, Authorization: `Bearer ${token}` };
}

async function fetchTwitchUserData(token) {
  const res = await fetch('https://api.twitch.tv/helix/users', { headers: authHeaders(token) });
  if (!res.ok) throw new Error('Failed to load profile');
  return (await res.json()).data[0];
}

async function fetchFollowedStreams(userId, token) {
  const res = await fetch(`https://api.twitch.tv/helix/streams/followed?user_id=${userId}&first=100`, { headers: authHeaders(token) });
  if (!res.ok) throw new Error('Failed to load followed streams');
  return (await res.json()).data;
}

async function fetchFollowedChannels(userId, token) {
  const res = await fetch(`https://api.twitch.tv/helix/channels/followed?user_id=${userId}&first=100`, { headers: authHeaders(token) });
  if (!res.ok) throw new Error('Failed to load followed channels');
  return (await res.json()).data;
}

async function fetchTopGames(token, first) {
  const res = await fetch(`https://api.twitch.tv/helix/games/top?first=${first}`, { headers: authHeaders(token) });
  if (!res.ok) return [];
  return (await res.json()).data;
}

async function fetchChannelTeams(broadcasterId, token) {
  const res = await fetch(`https://api.twitch.tv/helix/teams/channel?broadcaster_id=${broadcasterId}`, { headers: authHeaders(token) });
  if (!res.ok) return [];
  return (await res.json()).data;
}

async function fetchTeamRoster(teamId, token) {
  const res = await fetch(`https://api.twitch.tv/helix/teams?id=${teamId}`, { headers: authHeaders(token) });
  if (!res.ok) return null;
  return (await res.json()).data[0] || null;
}

async function fetchStreamsByUserIds(userIds, token) {
  if (userIds.length === 0) return [];
  const chunks = [];
  for (let i = 0; i < userIds.length; i += 100) chunks.push(userIds.slice(i, i + 100));
  const results = await Promise.all(chunks.map(async chunk => {
    const params = chunk.map(id => `user_id=${id}`).join('&');
    const res = await fetch(`https://api.twitch.tv/helix/streams?${params}&first=100`, { headers: authHeaders(token) });
    if (!res.ok) return [];
    return (await res.json()).data;
  }));
  return results.flat();
}

async function fetchStreamsByGameId(gameId, token) {
  const res = await fetch(`https://api.twitch.tv/helix/streams?game_id=${gameId}&first=100`, { headers: authHeaders(token) });
  if (!res.ok) return [];
  return (await res.json()).data;
}

async function fetchUsersByIds(ids, token) {
  if (ids.length === 0) return [];
  const chunks = [];
  for (let i = 0; i < ids.length; i += 100) chunks.push(ids.slice(i, i + 100));
  const results = await Promise.all(chunks.map(async chunk => {
    const params = chunk.map(id => `id=${id}`).join('&');
    const res = await fetch(`https://api.twitch.tv/helix/users?${params}`, { headers: authHeaders(token) });
    if (!res.ok) return [];
    return (await res.json()).data;
  }));
  return results.flat();
}

async function fetchClipsForBroadcaster(broadcasterId, token, startedAt, endedAt) {
  const params = new URLSearchParams({ broadcaster_id: broadcasterId, started_at: startedAt, ended_at: endedAt, first: String(CLIPS_PER_STREAMER) });
  const res = await fetch(`https://api.twitch.tv/helix/clips?${params}`, { headers: authHeaders(token) });
  if (!res.ok) return [];
  return (await res.json()).data;
}

async function fetchVideosForBroadcaster(broadcasterId, token, first) {
  const res = await fetch(`https://api.twitch.tv/helix/videos?user_id=${broadcasterId}&type=archive&first=${first}`, { headers: authHeaders(token) });
  if (!res.ok) return [];
  return (await res.json()).data;
}

async function fetchScheduleForBroadcaster(broadcasterId, token, first) {
  const res = await fetch(`https://api.twitch.tv/helix/schedule?broadcaster_id=${broadcasterId}&first=${first}`, { headers: authHeaders(token) });
  if (!res.ok) return []; // 404 when the channel has no schedule published
  const data = await res.json();
  return (data.data && data.data.segments) || [];
}

async function getFollowedLive() {
  if (followedLiveCache) return followedLiveCache;
  followedLiveCache = await fetchFollowedStreams(currentUser.id, currentToken);
  return followedLiveCache;
}

async function getFollowedChannels() {
  if (followedChannelsCache) return followedChannelsCache;
  followedChannelsCache = await fetchFollowedChannels(currentUser.id, currentToken);
  return followedChannelsCache;
}

// --- Tab data builders ---
async function loadFollowing() {
  const [live, channels] = await Promise.all([getFollowedLive(), getFollowedChannels()]);
  const followedAtById = new Map(channels.map(c => [c.broadcaster_id, c.followed_at]));
  return live.map(s => ({ ...s, _followedAt: followedAtById.get(s.user_id) }));
}

async function loadDiscover() {
  const games = await fetchTopGames(currentToken, MAX_TOP_CATEGORIES_FOR_DISCOVER);
  if (games.length === 0) return [];
  const perCategory = await Promise.allSettled(games.map(async g => {
    const streams = await fetchStreamsByGameId(g.id, currentToken);
    return streams
      .filter(s => s.viewer_count < SMALL_STREAM_VIEWER_CEILING)
      .sort((a, b) => a.viewer_count - b.viewer_count)
      .slice(0, STREAMS_PER_CATEGORY_DISCOVER)
      .map(s => ({ ...s, _via: g.name }));
  }));
  const merged = new Map();
  perCategory.forEach(r => { if (r.status === 'fulfilled') r.value.forEach(s => { if (!merged.has(s.user_id)) merged.set(s.user_id, s); }); });
  return [...merged.values()];
}

async function loadTeammates() {
  const seeds = (await getFollowedLive()).slice(0, MAX_SEED_STREAMERS_FOR_TEAMMATES);
  if (seeds.length === 0) return [];
  const followedIds = new Set(seeds.map(s => s.user_id));

  const teamLookups = await Promise.allSettled(seeds.map(async s => ({ streamer: s.user_name, teams: await fetchChannelTeams(s.user_id, currentToken) })));
  const teamIdToStreamer = new Map();
  teamLookups.forEach(result => {
    if (result.status !== 'fulfilled') return;
    result.value.teams.forEach(team => { if (!teamIdToStreamer.has(team.id)) teamIdToStreamer.set(team.id, result.value.streamer); });
  });
  if (teamIdToStreamer.size === 0) return [];

  const rosterLookups = await Promise.allSettled([...teamIdToStreamer.keys()].map(async teamId => ({ via: teamIdToStreamer.get(teamId), roster: await fetchTeamRoster(teamId, currentToken) })));
  const memberIdToVia = new Map();
  rosterLookups.forEach(result => {
    if (result.status !== 'fulfilled' || !result.value.roster) return;
    (result.value.roster.users || []).forEach(member => {
      if (followedIds.has(member.user_id)) return;
      if (!memberIdToVia.has(member.user_id)) memberIdToVia.set(member.user_id, `${result.value.via}'s team`);
    });
  });
  if (memberIdToVia.size === 0) return [];

  const liveMembers = await fetchStreamsByUserIds([...memberIdToVia.keys()], currentToken);
  return liveMembers.map(s => ({ ...s, _via: memberIdToVia.get(s.user_id) }));
}

async function loadHiddenGems() {
  const seeds = await getFollowedLive();
  if (seeds.length === 0) return [];
  const followedIds = new Set(seeds.map(s => s.user_id));
  const categorySeen = new Map();
  seeds.forEach(s => { if (s.game_id && !categorySeen.has(s.game_id) && categorySeen.size < MAX_SEED_CATEGORIES_FOR_GEMS) categorySeen.set(s.game_id, s.game_name); });
  if (categorySeen.size === 0) return [];

  const perCategory = await Promise.allSettled([...categorySeen.entries()].map(async ([gameId, gameName]) => {
    const streams = await fetchStreamsByGameId(gameId, currentToken);
    return streams
      .filter(s => !followedIds.has(s.user_id) && s.viewer_count < SMALL_STREAM_VIEWER_CEILING)
      .sort((a, b) => a.viewer_count - b.viewer_count)
      .slice(0, GEMS_PER_CATEGORY)
      .map(s => ({ ...s, _via: gameName }));
  }));

  const merged = new Map();
  perCategory.forEach(result => { if (result.status === 'fulfilled') result.value.forEach(s => { if (!merged.has(s.user_id)) merged.set(s.user_id, s); }); });
  return [...merged.values()];
}

async function loadRisingStars() {
  const games = await fetchTopGames(currentToken, MAX_TOP_CATEGORIES_FOR_RISING);
  if (games.length === 0) return [];

  const perCategory = await Promise.allSettled(games.map(g => fetchStreamsByGameId(g.id, currentToken)));
  const candidates = new Map();
  perCategory.forEach(r => { if (r.status === 'fulfilled') r.value.forEach(s => { if (!candidates.has(s.user_id)) candidates.set(s.user_id, s); }); });
  const candidateList = [...candidates.values()].slice(0, MAX_RISING_CANDIDATES);
  if (candidateList.length === 0) return [];

  const users = await fetchUsersByIds(candidateList.map(s => s.user_id), currentToken);
  const userById = new Map(users.map(u => [u.id, u]));
  const cutoff = Date.now() - RISING_STARS_LOOKBACK_DAYS * 24 * 60 * 60 * 1000;

  return candidateList
    .map(s => ({ stream: s, user: userById.get(s.user_id) }))
    .filter(({ user }) => user && new Date(user.created_at).getTime() >= cutoff)
    .map(({ stream, user }) => ({ ...stream, _broadcasterType: user.broadcaster_type || 'none', _accountCreatedAt: user.created_at }));
}

async function loadClips() {
  const channels = (await getFollowedChannels()).slice(0, MAX_SEED_STREAMERS_FOR_CLIPS);
  if (channels.length === 0) return [];
  const now = new Date();
  const since = new Date(now.getTime() - CLIPS_LOOKBACK_DAYS * 24 * 60 * 60 * 1000);
  const startedAt = since.toISOString();
  const endedAt = now.toISOString();

  const perStreamer = await Promise.allSettled(channels.map(c => fetchClipsForBroadcaster(c.broadcaster_id, currentToken, startedAt, endedAt)));
  const clips = [];
  perStreamer.forEach(result => { if (result.status === 'fulfilled') clips.push(...result.value); });

  const uniqueById = new Map();
  clips.forEach(c => { if (!uniqueById.has(c.id)) uniqueById.set(c.id, c); });
  return [...uniqueById.values()];
}

// --- Rendering ---
function setStatus(message, isError) {
  statusArea.innerHTML = message ? `<p class="status-msg${isError ? ' error' : ''}">${message}</p>` : '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function formatDuration(seconds) {
  const total = Math.round(seconds || 0);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function formatRelativeTime(isoString) {
  const diffMs = Date.now() - new Date(isoString).getTime();
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  if (diffDays <= 0) return `${Math.max(1, Math.floor(diffMs / (1000 * 60 * 60)))}h ago`;
  if (diffDays === 1) return 'Yesterday';
  if (diffDays < 7) return `${diffDays}d ago`;
  return `${Math.floor(diffDays / 7)}w ago`;
}

function streamCardHtml(s) {
  const thumb = s.thumbnail_url.replace('{width}', '320').replace('{height}', '180');
  const viewers = new Intl.NumberFormat().format(s.viewer_count);
  const viaTag = s._via ? `<span class="via-tag">via ${escapeHtml(s._via)}</span>` : '';
  const statusTag = s._broadcasterType ? `<span class="status-badge">${escapeHtml(s._broadcasterType === 'none' ? 'not affiliated' : s._broadcasterType)}</span>` : '';
  return `
    <a class="stream-card" href="https://twitch.tv/${encodeURIComponent(s.user_login)}" target="_blank" rel="noopener noreferrer" data-kind="stream" data-user-id="${s.user_id}">
      <div class="thumb-wrap">
        <img class="thumbnail" src="${thumb}" alt="" loading="lazy" decoding="async" />
        <span class="live-badge">Live</span>
        ${statusTag}
        <span class="viewer-badge">${viewers} viewers</span>
      </div>
      <div class="stream-info">
        <p class="stream-title">${escapeHtml(s.title)}</p>
        <p class="streamer-name">${escapeHtml(s.user_name)}</p>
        <p class="game-name">${escapeHtml(s.game_name || 'No category')}</p>
        ${viaTag}
      </div>
    </a>`;
}

function clipCardHtml(c) {
  const views = new Intl.NumberFormat().format(c.view_count);
  const creatorNote = c.creator_name && c.creator_name !== c.broadcaster_name ? ` · clipped by ${escapeHtml(c.creator_name)}` : '';
  return `
    <a class="stream-card" href="${c.url}" target="_blank" rel="noopener noreferrer" data-kind="clip">
      <div class="thumb-wrap">
        <img class="thumbnail" src="${c.thumbnail_url}" alt="" loading="lazy" decoding="async" />
        <span class="viewer-badge">${views} views</span>
        <span class="duration-badge">${formatDuration(c.duration)}</span>
      </div>
      <div class="stream-info">
        <p class="stream-title">${escapeHtml(c.title)}</p>
        <p class="streamer-name">${escapeHtml(c.broadcaster_name)}</p>
        <p class="clip-meta">${formatRelativeTime(c.created_at)}${creatorNote}</p>
      </div>
    </a>`;
}

function renderPagination(totalItems, totalPages) {
  if (totalPages <= 1) { paginationControls.innerHTML = ''; return; }
  paginationControls.innerHTML = `
    <button id="page-prev" class="btn-logout" ${currentPage <= 1 ? 'disabled' : ''} type="button">&larr; Prev</button>
    <span class="page-indicator">Page ${currentPage} of ${totalPages} · ${totalItems} results</span>
    <button id="page-next" class="btn-logout" ${currentPage >= totalPages ? 'disabled' : ''} type="button">Next &rarr;</button>`;
  const prevBtn = document.getElementById('page-prev');
  const nextBtn = document.getElementById('page-next');
  if (prevBtn) prevBtn.addEventListener('click', () => { currentPage--; renderGrid(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  if (nextBtn) nextBtn.addEventListener('click', () => { currentPage++; renderGrid(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
}

function renderGrid() {
  const query = searchInput.value.trim().toLowerCase();
  const cfg = TABS[activeTab];
  let items = [...allStreams];

  if (cfg.isClips) {
    items.sort((a, b) => clipSort === 'views' ? b.view_count - a.view_count : new Date(b.created_at) - new Date(a.created_at));
    if (query) items = items.filter(c => c.broadcaster_name.toLowerCase().includes(query) || c.title.toLowerCase().includes(query));
  } else {
    if (query) items = items.filter(s => s.user_name.toLowerCase().includes(query) || (s.game_name || '').toLowerCase().includes(query));
    if (cfg.hasCommonFilters) items = items.filter(passesCommonFilters);
    if (cfg.isRising) {
      if (risingStatusFilter !== 'all') items = items.filter(s => (s._broadcasterType || 'none') === risingStatusFilter);
      items.sort((a, b) => risingSort === 'viewers' ? b.viewer_count - a.viewer_count : new Date(a.started_at) - new Date(b.started_at));
    }
  }

  const totalItems = items.length;
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = items.slice(start, start + PAGE_SIZE);

  if (totalItems === 0) {
    streamGrid.innerHTML = '';
    paginationControls.innerHTML = '';
    setStatus(allStreams.length === 0 ? cfg.empty : 'No results match your filters.');
    return;
  }

  setStatus('');
  cardDataById.clear();
  streamGrid.innerHTML = pageItems.map(item => {
    if (cfg.isClips) return clipCardHtml(item);
    cardDataById.set(item.user_id, item);
    return streamCardHtml(item);
  }).join('');
  renderPagination(totalItems, totalPages);
}

async function loadStreams() {
  const cached = tabCache[activeTab];
  if (cached && Date.now() - cached.timestamp < CACHE_TTL_MS) {
    allStreams = cached.data;
    renderGrid();
    return;
  }
  streamGrid.innerHTML = '';
  paginationControls.innerHTML = '';
  setStatus('Loading streams…');
  try {
    allStreams = await TABS[activeTab].load();
    tabCache[activeTab] = { data: allStreams, timestamp: Date.now() };
    renderGrid();
  } catch (err) {
    console.error(err);
    setStatus('Something went wrong loading streams. Try refreshing the page.', true);
  }
}

// --- Stream detail modal (click a card instead of navigating away) ---
streamGrid.addEventListener('click', e => {
  const card = e.target.closest('.stream-card');
  if (!card || card.dataset.kind !== 'stream') return;
  if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return; // let modifier/middle clicks open Twitch normally
  e.preventDefault();
  const item = cardDataById.get(card.dataset.userId);
  if (item) openStreamModal(item);
});

function openStreamModal(s) {
  document.getElementById('modal-streamer').textContent = s.user_name;
  document.getElementById('modal-category').textContent = s.game_name || 'No category';
  document.getElementById('modal-title-text').textContent = s.title || '';
  document.getElementById('modal-viewers').textContent = s.viewer_count != null ? `${new Intl.NumberFormat().format(s.viewer_count)} viewers` : '';
  document.getElementById('modal-live-badge').classList.toggle('hidden', s.type !== 'live');
  document.getElementById('modal-tags').innerHTML = (s.tags || []).map(t => `<span class="via-tag">${escapeHtml(t)}</span>`).join('');
  document.getElementById('modal-watch-btn').href = `https://twitch.tv/${encodeURIComponent(s.user_login)}`;
  document.getElementById('modal-avatar').src = '';
  document.getElementById('modal-avatar').alt = '';
  streamModal.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  loadModalDetails(s.user_id);
}

function closeStreamModal() {
  streamModal.classList.add('hidden');
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeStreamModal);
streamModal.addEventListener('click', e => { if (e.target === streamModal) closeStreamModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !streamModal.classList.contains('hidden')) closeStreamModal(); });

async function loadModalDetails(userId) {
  const videosEl = document.getElementById('modal-videos');
  const clipsEl = document.getElementById('modal-clips');
  const scheduleEl = document.getElementById('modal-schedule');
  videosEl.innerHTML = '<p class="status-msg">Loading…</p>';
  clipsEl.innerHTML = '<p class="status-msg">Loading…</p>';
  scheduleEl.innerHTML = '<p class="status-msg">Loading…</p>';

  const cached = modalDetailCache[userId];
  let result;
  if (cached && Date.now() - cached.timestamp < MODAL_CACHE_TTL_MS) {
    result = cached;
  } else {
    const since = new Date(Date.now() - CLIPS_LOOKBACK_DAYS * 24 * 60 * 60 * 1000).toISOString();
    const [videosR, clipsR, scheduleR, userR] = await Promise.allSettled([
      fetchVideosForBroadcaster(userId, currentToken, 3),
      fetchClipsForBroadcaster(userId, currentToken, since, new Date().toISOString()),
      fetchScheduleForBroadcaster(userId, currentToken, 3),
      fetchUsersByIds([userId], currentToken)
    ]);
    result = {
      timestamp: Date.now(),
      videos: videosR.status === 'fulfilled' ? videosR.value.slice(0, 3) : [],
      clips: clipsR.status === 'fulfilled' ? [...clipsR.value].sort((a, b) => b.view_count - a.view_count).slice(0, 3) : [],
      schedule: scheduleR.status === 'fulfilled' ? scheduleR.value.slice(0, 3) : [],
      user: userR.status === 'fulfilled' ? userR.value[0] : null
    };
    modalDetailCache[userId] = result;
  }

  if (result.user) {
    document.getElementById('modal-avatar').src = result.user.profile_image_url;
    document.getElementById('modal-avatar').alt = `${result.user.display_name}'s avatar`;
  }

  videosEl.innerHTML = result.videos.length
    ? result.videos.map(v => `<a class="mini-card" href="${v.url}" target="_blank" rel="noopener noreferrer"><img src="${v.thumbnail_url.replace('%{width}', '160').replace('%{height}', '90')}" alt="" loading="lazy" decoding="async" /><span class="mini-title">${escapeHtml(v.title)}</span><span class="mini-meta">${formatRelativeTime(v.created_at)}</span></a>`).join('')
    : '<p class="status-msg">No recent broadcasts found.</p>';

  clipsEl.innerHTML = result.clips.length
    ? result.clips.map(c => `<a class="mini-card" href="${c.url}" target="_blank" rel="noopener noreferrer"><img src="${c.thumbnail_url}" alt="" loading="lazy" decoding="async" /><span class="mini-title">${escapeHtml(c.title)}</span><span class="mini-meta">${new Intl.NumberFormat().format(c.view_count)} views</span></a>`).join('')
    : '<p class="status-msg">No clips in the last 30 days.</p>';

  scheduleEl.innerHTML = result.schedule.length
    ? result.schedule.map(seg => `<div class="mini-card static"><span class="mini-title">${escapeHtml(seg.title || (seg.category && seg.category.name) || 'Scheduled stream')}</span><span class="mini-meta">${new Date(seg.start_time).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span></div>`).join('')
    : '<p class="status-msg">No upcoming schedule published.</p>';
}

// --- Session bootstrap ---
async function showDiscoveryView() {
  document.getElementById('welcome-msg').textContent = currentUser.display_name;
  document.getElementById('user-avatar').src = currentUser.profile_image_url;
  document.getElementById('user-avatar').alt = `${currentUser.display_name}'s avatar`;
  loginView.classList.add('hidden');
  discoveryView.classList.remove('hidden');
  setActiveTab('following');
}

async function trySession(token) {
  const validation = await validateToken(token);
  if (!validation) { sessionStorage.removeItem(STORAGE_KEY); return false; }
  currentToken = token;
  sessionStorage.setItem(STORAGE_KEY, token);
  currentUser = await fetchTwitchUserData(token);
  currentUser.id = validation.user_id;
  await showDiscoveryView();
  return true;
}

async function init() {
  const urlToken = getAccessTokenFromUrl();
  if (urlToken) {
    history.replaceState(null, null, ' ');
    if (await trySession(urlToken)) return;
  }
  const storedToken = sessionStorage.getItem(STORAGE_KEY);
  if (storedToken) await trySession(storedToken);
}

init();
</script>
